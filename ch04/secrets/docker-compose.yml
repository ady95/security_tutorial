# 04-5. 실습: 코드에 포함된 Secret 찾아내고 제거하기
# lab: gitleaks 와 git 이 들어 있는 작업용 컨테이너. 네트워크 없이 실행한다
name: secbook-ch04-secrets

services:
  lab:
    image: zricethezav/gitleaks:v8.30.1
    entrypoint: ["sleep", "infinity"]
    working_dir: /work/demo-app
    network_mode: none
    volumes:
      - ./:/lab:ro
      - work:/work

volumes:
  work:
