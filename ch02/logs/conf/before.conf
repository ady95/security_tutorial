# 02-8 방어 전 설정 — /admin 은 기본 인증만 걸려 있고 시도 횟수 제한이 없다
server {
    listen 80;
    server_name target;

    location = / { return 200 "lab home\n"; }
    location = /about { return 200 "about this lab\n"; }

    location = /admin {
        auth_basic "lab admin";
        auth_basic_user_file /lab/htpasswd;
        # 주의: 여기서 return 을 쓰면 인증보다 먼저 실행되어 인증이 무시된다 — 파일을 응답한다
        default_type text/plain;
        alias /lab/admin.txt;
    }

    location / { return 404; }
}
