# 02-8 방어 후 설정 — /admin 요청을 IP당 분당 6회(순간 여유 2회)로 제한한다
limit_req_zone $binary_remote_addr zone=admin_limit:1m rate=6r/m;

server {
    listen 80;
    server_name target;

    location = / { return 200 "lab home\n"; }
    location = /about { return 200 "about this lab\n"; }

    location = /admin {
        limit_req zone=admin_limit burst=2 nodelay;
        limit_req_status 429;
        auth_basic "lab admin";
        auth_basic_user_file /lab/htpasswd;
        # 주의: 여기서 return 을 쓰면 인증·속도 제한보다 먼저 실행되어 둘 다 무시된다
        default_type text/plain;
        alias /lab/admin.txt;
    }

    location / { return 404; }
}
