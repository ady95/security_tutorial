# 02-2 실습용 웹 서버 설정 — 같은 로그인 요청을 HTTP(80)와 HTTPS(443)로 받는다
server {
    listen 80;
    listen 443 ssl;
    server_name target;

    ssl_certificate     /certs/lab.crt;
    ssl_certificate_key /certs/lab.key;

    location / {
        return 200 "lab target\n";
    }

    # 실습용 가짜 로그인 — 실제로 인증하지 않고 요청만 받는다
    location /login {
        return 200 "login received\n";
    }
}
