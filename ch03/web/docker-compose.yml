name: secbook-ch03-web
services:
  weak:
    build: .
    image: secbook/ch03-web:lab
    environment:
      LAB_APP: ${LAB_APP:-sqli}
      LAB_MODE: weak
      LAB_SECRET_KEY: lab-only-web-signing-key
    networks:
      lab:
        ipv4_address: 10.30.0.10
  fixed:
    build: .
    image: secbook/ch03-web:lab
    environment:
      LAB_APP: ${LAB_APP:-sqli}
      LAB_MODE: fixed
      LAB_SECRET_KEY: lab-only-web-signing-key
    networks:
      lab:
        ipv4_address: 10.30.0.11
  gateway:
    image: nginx:1.28-alpine
    depends_on: [weak, fixed]
    ports:
      - "127.0.0.1:18081:8081"
      - "127.0.0.1:18082:8082"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [lab, front]
  client:
    image: nicolaka/netshoot:v0.16
    command: ["sleep", "infinity"]
    networks:
      lab:
        ipv4_address: 10.30.0.20
networks:
  lab:
    internal: true
    ipam:
      config:
        - subnet: 10.30.0.0/24
  front: {}
