name: secbook-ch03-proxy
services:
  juice:
    image: bkimminich/juice-shop:v20.2.0
    networks:
      lab:
        ipv4_address: 10.30.0.10
  gateway:
    image: nginx:1.28-alpine
    depends_on: [juice]
    ports:
      - "127.0.0.1:13000:8080"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [lab, front]
networks:
  lab:
    internal: true
    ipam:
      config:
        - subnet: 10.30.0.0/24
  front: {}
