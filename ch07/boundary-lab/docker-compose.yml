name: secbook-ch07-boundary
services:
  lab:
    image: python:3.12-slim
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    working_dir: /lab
    command: [python, lab.py, normal]
    volumes: ["./:/lab"]
    environment:
      OPENAI_BASE_URL: http://ollama:11434/v1
      OPENAI_API_KEY: lab-only-ollama
      OPENAI_MODEL: qwen3.5:4b
      EMBED_MODEL: qwen3-embedding:0.6b
      LLM_REASONING_EFFORT: none
    networks: [lab]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 64
  ollama:
    image: ollama/ollama:0.35.0
    volumes: [models:/root/.ollama]
    networks: [lab, download]
    cpus: 4
    mem_limit: 8g
networks:
  lab:
    internal: true
    ipam:
      config:
        - subnet: 10.30.0.0/24
  download: {}
volumes:
  models: {}
